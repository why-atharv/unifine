[build]
  command   = "npm run build"
  publish   = ".next"

# Next.js runtime adapter — installed as a dev dependency
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Environment variables (set these in Netlify UI → Site → Environment variables) ──
# DATABASE_URL    = "postgresql://user:password@host:5432/unifine"
# AUTH_SECRET     = "<random string, 16+ characters>"
